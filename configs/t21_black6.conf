# BLACK RELOCATED TO GAP 6 — from the author's own sentence.
#
# The right test, and nothing has run it. Every existing t21 run either holds
# `black` at slot 10 or frees slot 10 to a pool that does not contain `black`
# (verified: 0 occurrences of black in t21_readme54.conf's POOL lines). So
# `black at a gap` has never been placed by any sweep.
#
# WHY. Slot 10's number comes from "номер X" -- and X is the one glyph nobody
# can read. But the WORD comes from "чёрный день", the only sentence the author
# wrote as himself. Those provenances are not equal: the word may be the best-
# attested item in the whole table, sitting at a slot number that is unreadable.
#
# t21_free10 therefore tested the wrong half. It asked "is a different word
# right at slot 10?" The inscription argues the opposite: black is right, the
# SLOT is wrong. Here black is pinned at gap 6 and slot 10 is freed to the
# 54-word pool, with the remaining gaps pooled as usual.
#
