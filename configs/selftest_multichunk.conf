# MULTI-CHUNK POSITIVE CONTROL
#
# The existing selftest_find.conf searches 4,194,304 sequences -> ~262,144
# derivations, which fits in ONE chunk. It therefore proves the solver can find
# an unknown word, but it has never proven that candidates are not dropped at
# chunk boundaries.
#
# Every large run in this project is multi-chunk. If the chunking skips
# candidates, all of them are void and nothing so far would have detected it.
#
# This config blanks THREE slots of a known mnemonic to @FULL:
#   2048^3 = 8,589,934,592 sequences -> ~537M derivations -> many chunks.
#
# Known answer:
#   tiger live melody inject guitar nose route obtain ball diesel snow radar
#   m/44'/0'/0'/0/0 -> 1Q4BqYqf6iaSMqi2D3uPG95uA4kZ4bHUjd
#
# Expected: HIT, recovering melody (3), snow (11) and radar (12).
# If it exhausts with no match, chunking drops candidates and every
# multi-chunk negative in this project is invalid.
WORDS 12
TARGET 1Q4BqYqf6iaSMqi2D3uPG95uA4kZ4bHUjd
PATH m/44'/0'/0'/0/0
SLOT 1  tiger
SLOT 2  live
SLOT 3  @FULL
SLOT 4  inject
SLOT 5  guitar
SLOT 6  nose
SLOT 7  route
SLOT 8  obtain
SLOT 9  ball
SLOT 10 diesel
SLOT 11 @FULL
SLOT 12 @FULL
