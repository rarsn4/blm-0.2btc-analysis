# BRAINWALLET at t21 with the ELEVEN NON-BIP39 IMAGE WORDS included.
#
# The t21 analogue of brain_t18_pool63.conf. Note the pool is 65, not 63: the
# t18 run took the 52-word pool plus the eleven image words, and the t21
# template's own pool is 54 (the 52 plus `any` and `verb`). 54 + 11 = 65. Naming
# this "63" would carry the t18 figure onto a different template.
#
#   stop  freedom  hate  white  death  kill  war  bleed  shut  money  buy
#
# Not BIP39, so unencodable as a mnemonic and unchecksummable -- and perfectly
# valid brainwallet input, because SHA-256 does not care what the string is.
#
# Six @POOL slots plus SLOT 20 taking two words:
#   65^6 * 2 = 150,837,781,250 candidates, ALL of which derive (no checksum).
#
# TWO DELIBERATE NARROWINGS. Both are staged, not dropped, and both are stated
# here so nobody compares this run against the t18 result and assumes parity.
#
# 1. CASE lower only. The artwork is in capitals and SHA-256 is case-sensitive,
#    so this run does NOT cover the capitalised reading; upper is a separate
#    run. Lowercase carries the higher prior and combining the two would cost a
#    day to answer the likelier case no sooner.
#
# 2. KEY VARIANTS: sha256 + space-joined only. This is 3 addresses per
#    candidate (1 scalar mult, serialised three ways). The t18 figure §2.12
#    reports -- 992,436,543 candidates -> 7,939,492,344 addresses, a ratio of
#    exactly 8 -- came from brain_t18_pool63_all.conf, which sets
#    BRAINHASH sha256 dsha256 and BRAINSPACE yes no. The _all equivalent here
#    would be 2 x 2 x 3 = 12 addresses per candidate and 4 scalar mults.
#
#    So this run covers ONE QUARTER of the key-variant space that the reported
#    t18 result covered. The pubkey encodings are free -- one EC multiply
#    serialised three ways -- but BRAINHASH and BRAINSPACE each produce a
#    DIFFERENT PRIVATE KEY, so they are the expensive axis, and they are the
#    axis narrowed here. sha256 + space-joined is the canonical form and the
#    higher prior; the same staging logic as CASE lower.
#
#    A later `_all` run is what closes the gap. Until it exists, §2.12's t21
#    scope line must name BOTH narrowings.
SCHEME brainwallet
TARGET 1KfZGvwZxsvSmemoCmEV75uqcNzYBHjkHZ
WORDS 21
BRAINHASH  sha256
BRAINSPACE yes
BRAINPUB   all
CASE       lower
SLOT 1  subject
SLOT 2  camera
SLOT 3  tower
SLOT 4  mask
SLOT 5  police
SLOT 6  @POOL
SLOT 7  liberty
SLOT 8  @POOL
SLOT 9  eye
SLOT 10 black
SLOT 11 pyramid
SLOT 12 vote
SLOT 13 moon
SLOT 14 @POOL
SLOT 15 @POOL
SLOT 16 rifle
SLOT 17 gold
SLOT 18 @POOL
SLOT 19 glove
SLOT 20 apple|second
SLOT 21 @POOL
POOL able accuse agree any axis cause crime deal debate exist fire first food
POOL future gun hand happy know life major maximum minimum mobile need neither news
POOL only order paper party payment peace phone place power predict price proof punch
POOL receive security space stock that there they thing time trade twin verb weapon
POOL welcome world
EXTRA stop freedom hate white death kill war bleed shut money buy
POOL  stop freedom hate white death kill war bleed shut money buy
