# BRAINWALLET PLANTED-HIT CONTROL, multi-chunk.
#
# brain_selftest.conf has a space of 1, so it proves k_derive and nothing else.
# This one has 63^5 = 992,436,543 candidates and plants the answer at global
# index 214,072, so it also exercises decode_template, k_filter's accept-all
# branch and the chunk loop. Run it with a small --chunk to force many joins,
# and with --seam 214072 to put the answer on a boundary:
#
#   ./solver2 --config brain_find.conf --chunk 50000
#   ./solver2 --config brain_find.conf --chunk 50000 --seam 214072
#   ./solver2 --config brain_find.conf --chunk 50000 --seam 214073
#
# THREE of the five planted gap words are non-BIP39 (freedom, war, money), so
# this config is unrepresentable in BIP39 mode by construction. That is the
# point of EXTRA, and the reason a brainwallet sweep of the image words is a
# new derivation class rather than a re-run of an old one.
#
# Expected: HIT at index 214072, sha256 / space-joined / compressed.
SCHEME brainwallet
TARGET 1BZMezx4Sdxq9AiUSXPMDoakQDAw1pwVv1
WORDS 18
BRAINHASH  sha256
BRAINSPACE yes
BRAINPUB   compressed
EXTRA stop freedom hate white death kill war bleed shut money buy
SLOT 1  subject
SLOT 2  camera
SLOT 3  tower
SLOT 4  mask
SLOT 5  police
