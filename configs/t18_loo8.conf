# LEAVE-ONE-OUT, PROPERLY: slot 8 over the ENTIRE 2048-word dictionary,
# the other four gaps over the CURRENT 54-word README pool, on ALL FOUR paths.
#
# WHY THIS EXISTS. t18_full8.conf already sweeps slot 8 @FULL -- but it does so
# with the other four gaps drawing from the OLD 37-word pool, and with no PATH
# lines at all, so it ran the single default path m/44'/0'/0'/0/0.
#
# No config in this project combines @FULL with a pool >= 52 or with 4 paths.
# So the report's "[EXHAUSTED] leave-one-out over the entire 2048-word
# dictionary at each gap" holds only under the 37-word pool on one path. Two
# regions were never tested:
#
#   (a) slot 8 = any word, while another gap uses one of the 15 words added
#       in the 52-pool or the 2 added in the 54-pool:
#       able cause crime exist happy know neither only party peace place
#       that they thing time  (+ any, verb)
#   (b) the entire leave-one-out family on paths 2-4.
#
# This matters most for words outside EVERY pool. `flag`, `banner`, `nation`,
# `state`, `eagle`, `field`, `glory`, `salute` are all BIP39 and none has ever
# been in a gap pool -- they are reachable only through an @FULL sweep.
#
# 2048 x 54^4 = 17,414,258,688 candidates -> ~272M derivations -> ~4.8 h.
WORDS 18
TARGET 1KfZGvwZxsvSmemoCmEV75uqcNzYBHjkHZ
PATH m/44'/0'/0'/0/0
PATH m/0'/0/0
PATH m/0/0
PATH m/44'/0'/0'/0/1
SLOT 1  subject
SLOT 2  camera
SLOT 3  tower
SLOT 4  mask
SLOT 5  police
SLOT 6  @POOL
SLOT 7  liberty
SLOT 8  @FULL
SLOT 9  eye
SLOT 10 black
SLOT 11 pyramid
SLOT 12 vote
SLOT 13 moon
SLOT 14 @POOL
SLOT 15 @POOL
SLOT 16 rifle
SLOT 17 gold
SLOT 18 @POOL
POOL able accuse agree any axis cause crime deal debate exist fire first food
POOL future gun hand happy know life major maximum minimum mobile need neither news
POOL only order paper party payment peace phone place power predict price proof punch
POOL receive security space stock that there they thing time trade twin verb weapon
POOL welcome world
