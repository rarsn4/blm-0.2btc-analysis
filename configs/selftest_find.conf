# POSITIVE CONTROL — the solver must FIND this, not just verify it.
#
# Known mnemonic:
#   tiger live melody inject guitar nose route obtain ball diesel snow radar
#   m/44'/0'/0'/0/0  ->  1Q4BqYqf6iaSMqi2D3uPG95uA4kZ4bHUjd
#
# Slots 3 and 11 are blanked to @FULL, so the solver searches all 2048 words
# at each: 2048^2 = 4,194,304 sequences, ~262,144 after checksum. ~2 s.
#
# Expected result: HIT, recovering "melody" at 3 and "snow" at 11.
# If it exhausts with no match, the pipeline is broken and every negative
# result in this project is void.
WORDS 12
TARGET 1Q4BqYqf6iaSMqi2D3uPG95uA4kZ4bHUjd
PATH m/44'/0'/0'/0/0
SLOT 1  tiger
SLOT 2  live
SLOT 3  @FULL
SLOT 4  inject
SLOT 5  guitar
SLOT 6  nose
SLOT 7  route
SLOT 8  obtain
SLOT 9  ball
SLOT 10 diesel
SLOT 11 @FULL
SLOT 12 radar
