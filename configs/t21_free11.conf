# FREE-ONE-FIXED AT 21 WORDS — slot 11 (pyramid) freed.
#
# THE GAP THIS CLOSES. Every t21 run to date frees a GAP (6, 8, 14, 15, 18, 21).
# Not one frees an ASSIGNED slot. Audited across all 20 t21 configs: the only
# assigned slot ever varied is 20, and only as a two-way apple|second list.
# free-one-fixed exists only at 18 words (13 slots x 53 candidates, 37^5 gaps).
# So "a fixed word is wrong" is not an infeasible branch at t21 -- it is an
# UNTESTED one. You do not need to know which word is wrong; you iterate.
#
# WHY THIS BRANCH MATTERS. At p~0.75 per assigned word, the 0-wrong branch that
# the entire t21 campaign exhausted -- t21_readme54, six leave-one-out sweeps,
# ~78e9 derivations -- carries about 1.8% of the probability. The 1-wrong branch
# carries ~8.3%.
#
# WHY THE FREED RANGE IS 55, NOT 2048. Freeing to the whole dictionary is 1,216 h
# per run. The freed range here is the 54-word README pool plus the slot's
# current word: the set of words the document actually derives from the image,
# which is the same basis the gaps already use. This mirrors t18's
# free-one-fixed, which freed to 53. Cost: 55 x 54^6 = ~32.7 h.
#
# WHY THE GAPS ARE NOT SHRUNK. A k=3 section-specific pool per gap would cut this
# to 3.8 h, but no such mapping exists: README S21 gives no section-to-slot
# assignment, S14 supplies world/welcome/paper without assigning them to slot 18,
# and there is no flag section for slot 6. Shrinking on that basis would be the
# arbitrary reduction this project has rejected repeatedly.
#
# SURVIVOR COUNT IS BINOMIAL. The @FULL-equivalent slot is not the phrase's last
# word, so there is no exact check as in t21_loo21. Expect
# 10,654,063,447 +/- 102,815 (1 sigma).
