# SLOT 11 as the SPACE NEEDLE, under names never tried there.
#
# §2.17 ranks slot 11 the one slot that fits NEITHER reading: the stated conflict
# is pyramid 5+6 against the Space Needle, and freeing slot 11 found no candidate
# fits at all -- so the problem is not choosing between two words, it is that
# neither is right.
#
# The lead: the Space Needle's original revolving restaurant, opened 1962, was
# called "the Eye of the Needle". `eye` is BIP39. `needle` is NOT.
#
# CHECKED AGAINST THE CONFIG THAT ACTUALLY RAN, t21_free11_p1.conf:
#   SLOT 11  55 words -- contains `space` and `pyramid`
#                     -- does NOT contain `eye` or `tower`
#   SLOT 20  PINNED to `second`, so slot 11 was never freed with `apple` at all
#   PATHS    ONE (m/44'/0'/0'/0/0), not four
# So `space`, the obvious name, is eliminated on path 1; `eye` and `tower`, the
# two other BIP39 words naming that object, have never been tried there on any
# path. A less obvious name for an object whose obvious name is already dead is
# what makes this worth 3.7 h.
#
# 3 x 2 = 6 combos x 54^6 = 148,769,467,776 candidates
# expected survivors 1,162,261,467 +/- 33,959 (1 sigma)
# wall ~3.7 h at the 11,080,699 cand/s measured on j17x19
#
# THREE LIMITS, so a null is not over-read:
#
# 1. `eye` is currently ASSIGNED at slot 9. If eye belongs at 11 then slot 9
#    needs a different word -- that is a=2 and this config does NOT cover it.
#    It tests eye@11 with eye@9 left in place. BIP39 permits a repeated word,
#    but it is semantically odd and is stated rather than glossed.
#
# 2. The supporting claim that the 1962 restaurant rotated once per HOUR,
#    matching the minute hand that carries TOWER, is UNRESOLVED and is NOT
#    offered as evidence. HistoryLink essay 1424 is reported to give one hour
#    with a 1-hp motor but could not be reached. spaceneedle.com confirms the
#    1-hp motor and gives no 1962 rotation time. Reachable figures are 45
#    (spaceneedle.com) and 47 (Wikipedia), both current-era; a minute hand takes
#    exactly 60. Sources disagree for 1962. The lead stands on "Eye of the
#    Needle" alone.
#
# 3. This config runs FOUR paths. The free-one-fixed run it supersedes at slot 11
#    ran ONE. So a null here closes more than that run did, and the comparison is
#    not like-for-like in the direction that favours this run.
#
# TESTED, not EXHAUSTED: a constructed hypothesis, not an author statement.
