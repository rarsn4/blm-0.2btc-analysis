#
# The collaborator's sweep tested the image TEXT phrases as brainwallets
# (22,638 keys, negative). What was never tested is the TEMPLATE WORD
# SEQUENCES as brainwallets: "subject camera tower mask police ..." hashed with
# SHA-256 rather than run through BIP39 + PBKDF2 + BIP32.
