# BRAINWALLET CONTROL, as a config file.
#
# The built-in --selftest-brain covers 12 vectors. This is the same canonical
# one driven through the ordinary --config path, so the CONFIG PARSER, the
# EXTRA word table, k_filter's accept-all branch and the chunk sizing are all
# exercised too, not just k_derive.
#
# "battery" and "staple" are NOT BIP39 words. That is the whole point of EXTRA:
# a brainwallet phrase need not come from the wordlist, and the canonical
# control cannot even be assembled without it.
#
# Expected: HIT at index 0, "sha256 of the space-joined phrase", uncompressed.
SCHEME brainwallet
TARGET 1JwSSubhmg6iPtRjtyqhUYYH7bZg3Lfy1T
EXTRA battery staple
WORDS 4
BRAINHASH  sha256
BRAINSPACE yes
BRAINPUB   both
SLOT 1 correct
SLOT 2 horse
SLOT 3 battery
SLOT 4 staple
