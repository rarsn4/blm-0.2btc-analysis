# BRAINWALLET t18 with the ELEVEN NON-BIP39 IMAGE WORDS included.
#
# This is the config that could not exist before brainwallet mode. In BIP39
# these eleven words were rejected outright -- they are not in the 2048-word
# list, so they cannot be encoded in 11 bits and cannot carry a checksum:
#
#   stop  freedom  hate  white  death  kill  war  bleed  shut  money  buy
#
# As brainwallet input they are perfectly valid: SHA-256 does not care what the
# string is. They were discarded earlier for a reason that only applies to the
# scheme being abandoned here, which makes the image word list strictly more
# interesting in this mode than it was in the last one.
#
# 63-word pool over 5 slots: 63^5 = 992,436,543 candidates, all of which derive.
SCHEME brainwallet
TARGET 1KfZGvwZxsvSmemoCmEV75uqcNzYBHjkHZ
WORDS 18
BRAINHASH  sha256
BRAINSPACE yes
BRAINPUB   both
SLOT 1  subject
SLOT 2  camera
SLOT 3  tower
SLOT 4  mask
SLOT 5  police
SLOT 6  @POOL
SLOT 7  liberty
SLOT 8  @POOL
SLOT 9  eye
SLOT 10 black
SLOT 11 pyramid
SLOT 12 vote
SLOT 13 moon
SLOT 14 @POOL
SLOT 15 @POOL
SLOT 16 rifle
SLOT 17 gold
SLOT 18 @POOL
POOL able accuse agree axis cause crime deal debate exist fire first food future
POOL gun hand happy know life major maximum minimum mobile need neither news only
POOL order paper party payment peace phone place power predict price proof punch receive
POOL security space stock that there they thing time trade twin weapon welcome world
EXTRA stop freedom hate white death kill war bleed shut money buy
POOL  stop freedom hate white death kill war bleed shut money buy
