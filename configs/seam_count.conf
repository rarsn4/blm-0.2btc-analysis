# SEAM COUNT CONTROL — small enough to run at absurd chunk sizes.
#
# The survivor count is a pure function of the config: the same candidates, the
# same checksum, every time. Chunking cannot change it. So running this at
# several --chunk sizes and requiring an IDENTICAL total is a direct test that
# no candidate is lost or duplicated at a chunk join.
#
# A planted hit proves one index maps correctly. Only an exact count proves
# none are missing. If N chunks each drop one candidate you lose N-1 out of
# billions — numerically irrelevant, fatal to the word "exhaustive".
#
# Two @FULL slots: 2048^2 = 4,194,304 candidates -> ~262,144 survivors.
# Slot 12 is pinned to the WRONG word (zoo, not radar) so this always exhausts
# and always reports its total.
WORDS 12
TARGET 1Q4BqYqf6iaSMqi2D3uPG95uA4kZ4bHUjd
PATH m/44'/0'/0'/0/0
SLOT 1  tiger
SLOT 2  live
SLOT 3  @FULL
SLOT 4  inject
SLOT 5  guitar
SLOT 6  nose
SLOT 7  route
SLOT 8  obtain
SLOT 9  ball
SLOT 10 diesel
SLOT 11 @FULL
SLOT 12 zoo
